<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 500"
  role="img"
  aria-labelledby="discovery-map-title discovery-map-description"
>
  <title id="discovery-map-title">
    Primer descubrimiento de LUNARIA
  </title>

  <desc id="discovery-map-description">
    Representación cartográfica de las primeras coordenadas descubiertas,
    con una zona circular alrededor del punto de interés.
  </desc>

  <rect
    width="800"
    height="500"
    fill="#343D73"
  />

  <!-- Líneas cartográficas -->
  <g
    fill="none"
    stroke="#864D98"
    stroke-width="1"
    opacity="0.5"
  >
    <path d="M0 100 C180 60 300 140 480 100 S680 60 800 110" />
    <path d="M0 180 C160 140 320 220 500 170 S680 150 800 190" />
    <path d="M0 270 C180 230 300 300 470 260 S680 230 800 280" />
    <path d="M0 360 C160 320 330 390 500 350 S680 330 800 370" />
    <path d="M0 440 C180 400 320 470 500 430 S680 410 800 450" />
  </g>

  <!-- Zona radial -->
  <circle
    cx="400"
    cy="250"
    r="110"
    fill="#026E7F"
    fill-opacity="0.15"
    stroke="#E9AF5E"
    stroke-width="2"
    stroke-dasharray="6 8"
  />

  <!-- Punto de descubrimiento -->
  <circle
    cx="400"
    cy="250"
    r="8"
    fill="#E9AF5E"
  />

  <circle
    cx="400"
    cy="250"
    r="18"
    fill="none"
    stroke="#E9AF5E"
    stroke-width="1"
    opacity="0.7"
  />

  <!-- Coordenadas -->
  <text
    x="400"
    y="400"
    fill="#E9AF5E"
    text-anchor="middle"
    font-family="Montserrat, sans-serif"
    font-size="16"
    letter-spacing="3"
  >
    -34.6037 / -58.3816
  </text>
</svg>